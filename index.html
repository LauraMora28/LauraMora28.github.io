<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoja de vida | Ingeniero de Software Full Stack</title>
  <meta name="description" content="Hoja de vida de desarrollador de software en formato ATS y formato visual, con descarga en PDF.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cv-ats.css">
  <link rel="stylesheet" href="css/cv-visual.css">
  <link rel="stylesheet" href="css/print.css">

  <!-- El tamaño de página (@page) se ajusta desde js/app.js según el formato elegido -->
  <style id="page-style"></style>
</head>
<body>

  <header class="toolbar no-print">
    <div class="toolbar__brand">Hoja de vida<span>.dev</span></div>

    <div class="toolbar__controls">
      <div class="segmented" role="tablist" aria-label="Formato de la hoja de vida">
        <button type="button" role="tab" id="tab-ats" data-modo="ats" aria-selected="false" aria-controls="cv-ats">Formato ATS</button>
        <button type="button" role="tab" id="tab-visual" data-modo="visual" aria-selected="true" aria-controls="cv-visual">Formato visual</button>
      </div>

      <div class="themes" id="themes" role="group" aria-label="Color del formato visual">
        <button type="button" class="swatch" data-theme="navy" aria-label="Tema azul marino" title="Azul marino" aria-pressed="true" style="background:#14253d"></button>
        <button type="button" class="swatch" data-theme="slate" aria-label="Tema grafito" title="Grafito" aria-pressed="false" style="background:#232a34"></button>
        <button type="button" class="swatch" data-theme="teal" aria-label="Tema verde azulado" title="Verde azulado" aria-pressed="false" style="background:#12312f"></button>
        <button type="button" class="swatch" data-theme="burgundy" aria-label="Tema vino" title="Vino" aria-pressed="false" style="background:#3b1e29"></button>
      </div>

      <button type="button" class="btn" id="btn-pdf">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="btn-pdf-label">Descargar PDF</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <article id="cv-ats" class="sheet cv-ats" role="tabpanel" aria-labelledby="tab-ats" hidden></article>
    <article id="cv-visual" class="sheet cv-visual" data-theme="navy" role="tabpanel" aria-labelledby="tab-visual"></article>
  </main>

  <p class="hint no-print">
    Al pulsar <strong>Descargar PDF</strong> se abre el diálogo de impresión: elige <em>Guardar como PDF</em>
    y desactiva «Encabezados y pies de página». El PDF conserva el texto seleccionable, necesario para los sistemas ATS.
  </p>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
